<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>空き待ちリスト | おしりーす</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/scss/style.css" />
    <script src="assets/js/user_storage.js"></script>
    <script src="assets/js/theme_init.js"></script>
    <script src="assets/js/product_data.js" defer></script>
    <script type="module" src="assets/js/waitlist_bootstrap.js"></script>
  </head>
  <body class="mobile_app">
    <main class="app_shell waitlist_page" data-waitlist-page>
      <header class="mypage_header">
        <a class="mypage_header__back" href="mypage.html" aria-label="マイページへ戻る">
          <img src="assets/images/back.png" alt="" />
        </a>
        <div class="mypage_header__actions">
          <a href="#" aria-label="通知">
            <img src="assets/images/notice-icon--outline.png" alt="" />
          </a>
          <a href="cart.html" aria-label="カート">
            <img src="assets/images/cart-icon--outline.png" alt="" />
          </a>
        </div>
      </header>

      <section class="waitlist_page__content" aria-labelledby="waitlist-title">
        <h1 id="waitlist-title">空き待ちリスト</h1>
        <p class="waitlist_page__description">希望するレンタル期間の空きを待っている商品です。</p>
        <p class="waitlist_page__status" data-waitlist-status role="status">
          空き待ちを読み込んでいます。
        </p>
        <div class="waitlist_list" data-waitlist-list></div>
        <div class="waitlist_page__empty" data-waitlist-empty hidden>
          <p>空き待ちに登録した商品はありません</p>
          <a href="home.html">商品を探す</a>
        </div>
      </section>

      <footer class="app_footer">
        <nav aria-label="フッターナビゲーション">
          <a href="about.html">お店について</a>
          <a href="usage_guide.html">使い方ガイド</a>
          <a href="terms.html">利用規約</a>
          <a href="privacy_policy.html">個人情報保護方針</a>
        </nav>
        <small>Tokimekilab&copy;2026</small>
      </footer>

      <nav class="bottom_nav" aria-label="下部ナビゲーション">
        <a
          href="home.html"
          data-nav-icon
          data-pages="home.html,artist_search.html,goods_search.html"
        >
          <img
            src="assets/images/home-icon--outline.png"
            data-outline="assets/images/home-icon--outline.png"
            data-filled="assets/images/home-icon--filled.png"
            alt=""
          />
          ホーム
        </a>
        <a href="favorites.html" data-favorite-nav>
          <span class="bottom_nav__favorite_icon" aria-hidden="true">♥</span>
          <span class="bottom_nav__badge" data-favorite-count>0</span>
          お気に入り
        </a>
        <a href="mypage.html" data-nav-icon data-pages="mypage.html">
          <img
            src="assets/images/mypage-icon--outline.png"
            data-outline="assets/images/mypage-icon--outline.png"
            data-filled="assets/images/mypage-icon--filled.png"
            alt=""
          />
          マイページ
        </a>
      </nav>
    </main>
  </body>
</html>
