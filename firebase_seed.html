<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品データ初期登録 | おしりーす</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/scss/style.css" />
    <script src="assets/js/user_storage.js"></script>
    <script src="assets/js/product_data.js"></script>
    <script src="assets/js/password_toggle.js" defer></script>
    <script type="module" src="assets/js/firebase_seed.js"></script>
  </head>
  <body class="app_auth">
    <main class="auth_screen auth_screen--login">
      <header class="auth_header">
        <img src="assets/images/logo.png" alt="おしりーす" />
      </header>
      <section class="login_form" aria-labelledby="seed-title">
        <h1 id="seed-title">商品データ初期登録</h1>
        <p>Firebaseに登録した管理者アカウントで実行してください。</p>
        <form data-firebase-seed-form>
          <label>
            管理者メールアドレス
            <input name="email" type="email" required autocomplete="username" />
          </label>
          <label>
            管理者パスワード
            <input name="password" type="password" required autocomplete="current-password" />
          </label>
          <p class="firebase_seed__status" data-seed-status role="status" aria-live="polite"></p>
          <button class="auth_primary" type="submit">商品データを登録する</button>
        </form>
      </section>
    </main>
  </body>
</html>
