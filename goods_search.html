<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>汎用品から探す | おしりーす</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/scss/style.css" />
    <script src="assets/js/app.js" defer></script>
  </head>
  <body class="mobile_app">
    <main class="app_shell">
      <header class="app_header">
        <a
          class="app_header__icon"
          href="color_change.html"
          aria-label="設定"
          data-nav-icon
          data-pages="color_change.html,password_setting.html,credit_card.html"
        >
          <img
            src="assets/images/setting-icon--outline.png"
            data-outline="assets/images/setting-icon--outline.png"
            data-filled="assets/images/setting-icon--filled.png"
            alt=""
          />
        </a>
        <img class="app_header__logo" src="assets/images/logo.png" alt="おしりーす" />
        <div class="app_header__actions">
          <a href="#" aria-label="通知" data-nav-icon data-pages="notice.html">
            <img
              src="assets/images/notice-icon--outline.png"
              data-outline="assets/images/notice-icon--outline.png"
              data-filled="assets/images/notice-icon--filled.png"
              alt=""
            />
          </a>
          <a href="cart.html" aria-label="カート" data-nav-icon data-pages="cart.html">
            <img
              src="assets/images/cart-icon--outline.png"
              data-outline="assets/images/cart-icon--outline.png"
              data-filled="assets/images/cart-icon--filled.png"
              alt=""
            />
          </a>
        </div>
      </header>
      <section class="search_intro search_intro--goods">
        <span class="search_choice__visual search_choice__visual--penlight">
          <img src="assets/images/penillust.png" alt="" />
        </span>
        <div>
          <h1>汎用品</h1>
          <p>
            どのライブでも使えるアイテムから
            <br />
            レンタルしたいアイテムを探せます。
          </p>
        </div>
      </section>
      <form action="search.html" class="app_search app_search--separate">
        <span aria-hidden="true">⌕</span>
        <input name="keyword" required aria-label="汎用品検索" placeholder="グッズ名で検索" />
      </form>
      <section class="goods_content">
        <div class="goods_grid">
          <a href="search.html?category=penlight">
            <span class="goods_grid__penlight_image">
              <img src="assets/images/penillust.png" alt="" />
            </span>
            <b>ペンライト</b>
          </a>
          <a href="search.html?category=fan">
            <span><img src="assets/images/utiwa.png" alt="" /></span>
            <b>うちわ</b>
          </a>
          <a href="binocular_filter.html">
            <span>
              <img src="assets/images/sougannkyou.png" alt="" />
            </span>
            <b>双眼鏡</b>
          </a>
          <a href="search.html?category=bag">
            <span>
              <img src="assets/images/bag.png" alt="" />
            </span>
            <b>バッグ</b>
          </a>
          <a class="goods_grid__set" href="search.html?category=set">
            <span>
              <img src="assets/images/setto.png" alt="" />
            </span>
            <b>セット</b>
          </a>
        </div>
      </section>
      <footer class="app_footer">
        <nav aria-label="フッターナビゲーション">
          <a href="about.html">お店について</a>
          <a href="usage_guide.html">使い方ガイド</a>
          <a href="#">利用規約</a>
          <a href="privacy_policy.html">個人情報保護方針</a>
        </nav>
        <small>Tokimekilab&copy;2026</small>
      </footer>
      <nav class="bottom_nav" aria-label="下部ナビゲーション">
        <a
          href="home.html"
          data-nav-icon
          data-pages="home.html,artist_search.html,goods_search.html"
        >
          <img
            src="assets/images/home-icon--outline.png"
            data-outline="assets/images/home-icon--outline.png"
            data-filled="assets/images/home-icon--filled.png"
            alt=""
          />
          ホーム
        </a>
        <a href="favorites.html" data-favorite-nav>
          <span class="bottom_nav__favorite_icon" aria-hidden="true">♥</span>
          <span class="bottom_nav__badge" data-favorite-count>0</span>
          お気に入り
        </a>
        <a href="mypage.html" data-nav-icon data-pages="mypage.html">
          <img
            src="assets/images/mypage-icon--outline.png"
            data-outline="assets/images/mypage-icon--outline.png"
            data-filled="assets/images/mypage-icon--filled.png"
            alt=""
          />
          マイページ
        </a>
      </nav>
    </main>
  </body>
</html>
