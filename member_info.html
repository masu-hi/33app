<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>会員情報 | おしりーす</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/scss/style.css" />
    <script src="assets/js/app.js" defer></script>
  </head>
  <body class="mobile_app">
    <main class="app_shell member_info_page">
      <header class="app_header">
        <a
          class="app_header__icon"
          href="color_change.html"
          aria-label="設定"
          data-nav-icon
          data-pages="color_change.html,password_setting.html,credit_card.html"
        >
          <img
            src="assets/images/setting-icon--outline.png"
            data-outline="assets/images/setting-icon--outline.png"
            data-filled="assets/images/setting-icon--filled.png"
            alt=""
          />
        </a>
        <img class="app_header__logo" src="assets/images/logo.png" alt="おしりーす" />
        <div class="app_header__actions">
          <a href="#" aria-label="通知" data-nav-icon data-pages="notice.html">
            <img
              src="assets/images/notice-icon--outline.png"
              data-outline="assets/images/notice-icon--outline.png"
              data-filled="assets/images/notice-icon--filled.png"
              alt=""
            />
          </a>
          <a href="cart.html" aria-label="カート" data-nav-icon data-pages="cart.html">
            <img
              src="assets/images/cart-icon--outline.png"
              data-outline="assets/images/cart-icon--outline.png"
              data-filled="assets/images/cart-icon--filled.png"
              alt=""
            />
          </a>
        </div>
      </header>

      <section class="member_info" aria-labelledby="member-info-title" data-member-info>
        <h1 id="member-info-title">会員情報</h1>
        <p class="member_info__intro" data-member-intro>登録されている会員情報を確認できます。</p>
        <dl class="member_info__list">
          <div>
            <dt>お名前</dt>
            <dd data-member-value="name">未登録</dd>
          </div>
          <div>
            <dt>フリガナ</dt>
            <dd data-member-value="kana">未登録</dd>
          </div>
          <div>
            <dt>生年月日</dt>
            <dd data-member-value="birthday">未登録</dd>
          </div>
          <div>
            <dt>郵便番号</dt>
            <dd data-member-value="postal">未登録</dd>
          </div>
          <div>
            <dt>住所</dt>
            <dd data-member-value="address">未登録</dd>
          </div>
          <div>
            <dt>建物名・部屋番号</dt>
            <dd data-member-value="building">未登録</dd>
          </div>
          <div>
            <dt>メールアドレス</dt>
            <dd data-member-value="email">未登録</dd>
          </div>
          <div>
            <dt>推しカラー</dt>
            <dd data-member-value="favorite_color">未登録</dd>
          </div>
        </dl>
        <button class="member_info__edit_button" type="button" data-member-edit>
          登録情報を変更する
        </button>
        <form class="member_info__form" data-member-edit-form hidden>
          <label>
            お名前
            <input name="name" required autocomplete="name" />
          </label>
          <label>
            フリガナ
            <input name="kana" required />
          </label>
          <fieldset class="member_info__birth_fields">
            <legend>生年月日</legend>
            <div>
              <input
                name="birth_year"
                required
                inputmode="numeric"
                maxlength="4"
                placeholder="年"
              />
              <span>年</span>
              <input
                name="birth_month"
                required
                inputmode="numeric"
                maxlength="2"
                placeholder="月"
              />
              <span>月</span>
              <input name="birth_day" required inputmode="numeric" maxlength="2" placeholder="日" />
              <span>日</span>
            </div>
          </fieldset>
          <label>
            郵便番号
            <span class="member_info__postal_fields">
              <input
                name="postal_first"
                required
                inputmode="numeric"
                maxlength="3"
                placeholder="123"
              />
              <b>-</b>
              <input
                name="postal_last"
                required
                inputmode="numeric"
                maxlength="4"
                placeholder="4567"
              />
            </span>
          </label>
          <label>
            都道府県
            <input name="prefecture" required />
          </label>
          <label>
            市区町村番地
            <input name="address" required autocomplete="street-address" />
          </label>
          <label>
            建物名・部屋番号
            <input name="building" />
          </label>
          <label>
            メールアドレス
            <input name="email" type="email" required autocomplete="email" />
          </label>
          <label>
            推しカラー
            <select name="favorite_color" required>
              <option>赤</option>
              <option>青</option>
              <option>ピンク</option>
              <option>紫</option>
              <option>緑</option>
              <option>黄色</option>
              <option>オレンジ</option>
              <option>水色</option>
              <option>白</option>
              <option>黒</option>
            </select>
          </label>
          <div class="member_info__form_actions">
            <button type="button" data-member-edit-cancel>キャンセル</button>
            <button type="submit">変更を保存する</button>
          </div>
        </form>
      </section>

      <footer class="app_footer">
        <nav aria-label="フッターナビゲーション">
          <a href="about.html">お店について</a>
          <a href="usage_guide.html">使い方ガイド</a>
          <a href="#">利用規約</a>
          <a href="privacy_policy.html">個人情報保護方針</a>
        </nav>
        <small>Tokimekilab&copy;2026</small>
      </footer>
      <nav class="bottom_nav" aria-label="下部ナビゲーション">
        <a
          href="home.html"
          data-nav-icon
          data-pages="home.html,artist_search.html,goods_search.html,search.html,product_detail.html"
        >
          <img
            src="assets/images/home-icon--outline.png"
            data-outline="assets/images/home-icon--outline.png"
            data-filled="assets/images/home-icon--filled.png"
            alt=""
          />
          ホーム
        </a>
        <a href="favorites.html" data-favorite-nav>
          <span class="bottom_nav__favorite_icon" aria-hidden="true">♥</span>
          <span class="bottom_nav__badge" data-favorite-count>0</span>
          お気に入り
        </a>
        <a
          href="mypage.html"
          data-nav-icon
          data-pages="mypage.html,rental_history.html,member_info.html,color_change.html,password_setting.html,credit_card.html"
        >
          <img
            src="assets/images/mypage-icon--outline.png"
            data-outline="assets/images/mypage-icon--outline.png"
            data-filled="assets/images/mypage-icon--filled.png"
            alt=""
          />
          マイページ
        </a>
      </nav>
    </main>
  </body>
</html>
