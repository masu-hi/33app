<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LEDコンサートライト | おしりーす</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/scss/style.css" />
    <script src="assets/js/app.js" defer></script>
  </head>
  <body class="mobile_app">
    <main class="app_shell product_detail_page">
      <header class="app_header">
        <a
          class="app_header__icon"
          href="#"
          aria-label="設定"
          data-nav-icon
          data-pages="settings.html"
        >
          <img
            src="assets/images/setting-icon--outline.png"
            data-outline="assets/images/setting-icon--outline.png"
            data-filled="assets/images/setting-icon--filled.png"
            alt=""
          />
        </a>
        <img class="app_header__logo" src="assets/images/logo.png" alt="おしりーす" />
        <div class="app_header__actions">
          <a href="#" aria-label="通知" data-nav-icon data-pages="notice.html">
            <img
              src="assets/images/notice-icon--outline.png"
              data-outline="assets/images/notice-icon--outline.png"
              data-filled="assets/images/notice-icon--filled.png"
              alt=""
            />
          </a>
          <a href="cart.html" aria-label="カート" data-nav-icon data-pages="cart.html">
            <img
              src="assets/images/cart-icon--outline.png"
              data-outline="assets/images/cart-icon--outline.png"
              data-filled="assets/images/cart-icon--filled.png"
              alt=""
            />
          </a>
        </div>
      </header>

      <section class="results_header product_detail_header">
        <div class="results_header__title">
          <button type="button" aria-label="前の画面へ戻る" data-history-back>←</button>
          <h1>商品詳細</h1>
        </div>
      </section>

      <section class="product_detail" aria-label="商品詳細">
        <div class="product_detail__media" aria-label="商品画像ギャラリー">
          <div
            class="product_detail__gallery"
            data-product-gallery
            tabindex="0"
            aria-expanded="false"
            aria-label="商品画像。左右にスワイプ、または左右の矢印キーで切り替え"
          >
            <div class="product_detail__gallery_slide">
              <img src="assets/images/penlight.png" alt="LEDコンサートライトの全体" />
            </div>
            <div class="product_detail__gallery_slide product_detail__gallery_slide--colors">
              <img
                src="assets/images/penlight.png"
                alt="LEDコンサートライトのカラーバリエーション"
              />
            </div>
            <div class="product_detail__gallery_slide product_detail__gallery_slide--body">
              <img src="assets/images/penlight.png" alt="LEDコンサートライトの本体部分" />
            </div>
            <div class="product_detail__gallery_slide product_detail__gallery_slide--features">
              <img src="assets/images/penlight.png" alt="LEDコンサートライトの機能" />
            </div>
            <div class="product_detail__gallery_slide product_detail__gallery_slide--strap">
              <img src="assets/images/penlight.png" alt="LEDコンサートライトのストラップ" />
            </div>
          </div>
          <button
            class="product_detail__gallery_button product_detail__gallery_button--previous"
            type="button"
            aria-label="前の画像を表示"
            data-gallery-previous
            hidden
          >
            ‹
          </button>
          <button
            class="product_detail__gallery_button product_detail__gallery_button--next"
            type="button"
            aria-label="次の画像を表示"
            data-gallery-next
            hidden
          >
            ›
          </button>
          <span class="product_detail__image_count" data-gallery-count aria-live="polite">
            1 / 5
          </span>
        </div>
        <div class="product_detail__info">
          <div class="product_detail__heading">
            <p class="tag">汎用品</p>
            <button class="product_detail__favorite" type="button" aria-label="お気に入りに追加">
              ♡
            </button>
          </div>
          <h2>ペンライト（シンプルタイプ）</h2>
          <p class="product_detail__price">¥2,400 / 3日〜</p>
          <div class="product_detail__review_summary">
            <span aria-label="評価4.5、5点満点">★ 4.5</span>
            <button type="button" data-show-reviews>レビューを見る</button>
          </div>
          <p class="product_detail__description">
            シンプルで使いやすい定番のペンライトです。どんな場面でも使いやすい汎用タイプなので、初めての方でも使いやすいペンライトです。
          </p>
        </div>

        <section class="rental_calendar" aria-labelledby="rental-calendar-title">
          <h2 id="rental-calendar-title">レンタル可能日</h2>
          <div class="rental_calendar__frame" aria-label="カレンダーのダミー表示">
            <span>カレンダー</span>
          </div>
          <div class="rental_calendar__legend" aria-label="カレンダーの凡例">
            <span>
              <i class="rental_calendar__legend_mark rental_calendar__legend_mark--available"></i>
              レンタル可能
            </span>
            <span class="is_unavailable">
              <i class="rental_calendar__legend_mark rental_calendar__legend_mark--unavailable">
                ×
              </i>
              レンタル不可
            </span>
            <span>
              <i class="rental_calendar__legend_mark rental_calendar__legend_mark--selected"></i>
              選択中
            </span>
          </div>
          <p class="rental_calendar__period">レンタル期間</p>
          <p class="rental_calendar__selected_period" data-selected-period>
            9月24日(木)～9月26日(土)　3日間
          </p>
          <button class="product_detail__cart_button" type="button" data-add-cart>
            <span>カート</span>
            <span aria-hidden="true">🛒</span>
            <b aria-hidden="true">→</b>
          </button>
        </section>
      </section>

      <footer class="app_footer">
        <nav aria-label="フッターナビゲーション">
          <a href="#">お店について</a>
          <a href="#">使い方ガイド</a>
          <a href="#">利用規約</a>
          <a href="#">個人情報保護方針</a>
        </nav>
        <small>Tokimekilab&copy;2026</small>
      </footer>
      <nav class="bottom_nav" aria-label="下部ナビゲーション">
        <a
          href="home.html"
          data-nav-icon
          data-pages="home.html,artist_search.html,goods_search.html,search.html,product_detail.html"
        >
          <img
            src="assets/images/home-icon--outline.png"
            data-outline="assets/images/home-icon--outline.png"
            data-filled="assets/images/home-icon--filled.png"
            alt=""
          />
          ホーム
        </a>
        <a href="mypage.html" data-nav-icon data-pages="mypage.html">
          <img
            src="assets/images/mypage-icon--outline.png"
            data-outline="assets/images/mypage-icon--outline.png"
            data-filled="assets/images/mypage-icon--filled.png"
            alt=""
          />
          マイページ
        </a>
      </nav>
    </main>
  </body>
</html>
