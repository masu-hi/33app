<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>双眼鏡を選ぶ | おしりーす</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/scss/style.css" />
    <script src="assets/js/user_storage.js"></script>
    <script src="assets/js/app.js" defer></script>
  </head>
  <body class="mobile_app">
    <main class="app_shell binocular_filter_page">
      <header class="app_header">
        <button
          class="app_header__icon app_header__back"
          type="button"
          aria-label="前の画面へ戻る"
          data-history-back
        >
          <img src="assets/images/back.png" alt="" />
        </button>
        <img class="app_header__logo" src="assets/images/logo.png" alt="おしりーす" />
        <div class="app_header__actions">
          <a href="#" aria-label="通知" data-nav-icon data-pages="notice.html">
            <img
              src="assets/images/notice-icon--outline.png"
              data-outline="assets/images/notice-icon--outline.png"
              data-filled="assets/images/notice-icon--filled.png"
              alt=""
            />
          </a>
          <a href="cart.html" aria-label="カート" data-nav-icon data-pages="cart.html">
            <img
              src="assets/images/cart-icon--outline.png"
              data-outline="assets/images/cart-icon--outline.png"
              data-filled="assets/images/cart-icon--filled.png"
              alt=""
            />
          </a>
        </div>
      </header>

      <section class="binocular_filter_intro" aria-labelledby="binocular-filter-title">
        <div class="binocular_filter_intro__image">
          <img src="assets/images/sougannkyou.png" alt="双眼鏡" />
        </div>
        <div>
          <h1 id="binocular-filter-title">双眼鏡</h1>
          <p>
            ライブをもっと近くで楽しむためのアイテム
            <br />
            8倍から16倍までの倍率や、防振・防水機能の双眼鏡を幅広く取り揃えています。
          </p>
        </div>
      </section>

      <form action="search.html" class="app_search binocular_filter_search">
        <span aria-hidden="true">⌕</span>
        <input
          name="keyword"
          required
          aria-label="アーティスト名・ライブ会場・グッズで検索"
          placeholder="アーティスト名・ライブ会場・グッズで検索"
        />
      </form>

      <section class="binocular_filter_choices" aria-label="双眼鏡の絞り込み条件">
        <a href="search.html?category=binoculars&filter=8倍">8倍</a>
        <a href="search.html?category=binoculars&filter=10倍">10倍</a>
        <a href="search.html?category=binoculars&filter=12倍">12倍</a>
        <a href="search.html?category=binoculars&filter=14倍">14倍</a>
        <a href="search.html?category=binoculars&filter=16倍">16倍</a>
        <a href="search.html?category=binoculars&filter=防振">防振</a>
        <a href="search.html?category=binoculars&filter=防水">防水</a>
      </section>

      <footer class="app_footer">
        <nav aria-label="フッターナビゲーション">
          <a href="about.html">お店について</a>
          <a href="usage_guide.html">使い方ガイド</a>
          <a href="#">利用規約</a>
          <a href="privacy_policy.html">個人情報保護方針</a>
        </nav>
        <small>Tokimekilab&copy;2026</small>
      </footer>
      <nav class="bottom_nav" aria-label="下部ナビゲーション">
        <a
          href="home.html"
          data-nav-icon
          data-pages="home.html,artist_search.html,goods_search.html,binocular_filter.html,search.html,product_detail.html"
        >
          <img
            src="assets/images/home-icon--outline.png"
            data-outline="assets/images/home-icon--outline.png"
            data-filled="assets/images/home-icon--filled.png"
            alt=""
          />
          ホーム
        </a>
        <a href="favorites.html" data-favorite-nav>
          <span class="bottom_nav__favorite_icon" aria-hidden="true">♥</span>
          <span class="bottom_nav__badge" data-favorite-count>0</span>
          お気に入り
        </a>
        <a href="mypage.html" data-nav-icon data-pages="mypage.html">
          <img
            src="assets/images/mypage-icon--outline.png"
            data-outline="assets/images/mypage-icon--outline.png"
            data-filled="assets/images/mypage-icon--filled.png"
            alt=""
          />
          マイページ
        </a>
      </nav>
    </main>
  </body>
</html>
