<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>検索結果 | おしりーす</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="assets/js/user_storage.js"></script>
    <script src="assets/js/theme_init.js"></script>
    <link rel="stylesheet" href="src/scss/style.css" />
    <script src="assets/js/product_data.js" defer></script>
    <script type="module" src="assets/js/firebase_app_bootstrap.js"></script>
  </head>
  <body class="mobile_app is_product_data_loading" aria-busy="true">
    <div class="product_data_loading" data-product-data-loading role="status">
      <span class="product_data_loading__spinner" aria-hidden="true"></span>
      商品情報を読み込んでいます
    </div>
    <main class="app_shell results_page" data-results-page>
      <header class="app_header">
        <a
          class="app_header__icon"
          href="color_change.html"
          aria-label="設定"
          data-nav-icon
          data-pages="color_change.html,password_setting.html,credit_card.html"
        >
          <img
            src="assets/images/setting-icon--outline.png"
            data-outline="assets/images/setting-icon--outline.png"
            data-filled="assets/images/setting-icon--filled.png"
            alt=""
          />
        </a>
        <img class="app_header__logo" src="assets/images/logo.png" alt="おしりーす" />
        <div class="app_header__actions">
          <a href="#" aria-label="通知" data-nav-icon data-pages="notice.html">
            <img
              src="assets/images/notice-icon--outline.png"
              data-outline="assets/images/notice-icon--outline.png"
              data-filled="assets/images/notice-icon--filled.png"
              alt=""
            />
          </a>
          <a href="cart.html" aria-label="カート" data-nav-icon data-pages="cart.html">
            <img
              src="assets/images/cart-icon--outline.png"
              data-outline="assets/images/cart-icon--outline.png"
              data-filled="assets/images/cart-icon--filled.png"
              alt=""
            />
          </a>
        </div>
      </header>

      <section class="results_header">
        <div class="results_header__title">
          <button type="button" aria-label="前の画面へ戻る" data-history-back>
            <img src="assets/images/back.png" alt="" />
          </button>
          <h1 data-results-title>ペンライト</h1>
        </div>
        <form action="search.html" class="app_search">
          <span aria-hidden="true">⌕</span>
          <input
            name="keyword"
            required
            aria-label="このカテゴリで検索"
            placeholder="このカテゴリで検索"
            data-results-input
          />
        </form>
        <div class="sort_tabs" aria-label="並び替え">
          <button class="is_selected" type="button" data-sort="popular">人気順</button>
          <button type="button" data-sort="new">新着順</button>
          <button type="button" data-sort="low">安い順</button>
          <button type="button" data-sort="high">高い順</button>
        </div>
        <section
          class="binocular_filter"
          aria-labelledby="binocular-filter-title"
          data-binocular-filter
          hidden
        >
          <h2 id="binocular-filter-title">絞り込む</h2>
          <div class="binocular_filter__options" aria-label="双眼鏡の絞り込み条件">
            <button type="button" data-binocular-filter-option="8倍">8倍＋</button>
            <button type="button" data-binocular-filter-option="10倍">10倍＋</button>
            <button type="button" data-binocular-filter-option="12倍">12倍＋</button>
            <button type="button" data-binocular-filter-option="14倍">14倍＋</button>
            <button type="button" data-binocular-filter-option="16倍">16倍＋</button>
            <button type="button" data-binocular-filter-option="防振">防振＋</button>
            <button type="button" data-binocular-filter-option="防水">防水＋</button>
          </div>
        </section>
      </section>

      <section class="result_list" aria-label="検索結果" hidden>
        <article class="result_item" data-result-item data-price="2400" data-order="1">
          <a class="result_item__link" href="product_detail.html">
            <img src="assets/images/penlight.png" alt="" />
            <div>
              <h2 data-product-name>ペンライト（シンプルタイプ）</h2>
              <p>
                <span data-product-price>¥2,400</span>
                〜/
                <span data-rental-days>3日</span>
              </p>
            </div>
          </a>
          <button
            class="result_item__favorite"
            type="button"
            aria-label="お気に入りに追加"
            data-favorite-id="penlight-simple"
          >
            ♡
          </button>
        </article>
        <article class="result_item" data-result-item data-price="1800" data-order="4">
          <a class="result_item__link" href="product_detail.html">
            <img src="assets/images/penlight.png" alt="" />
            <div>
              <h2 data-product-name>ペンライト（スタンダード）</h2>
              <p>
                <span data-product-price>¥1,800</span>
                〜/
                <span data-rental-days>3日</span>
              </p>
            </div>
          </a>
          <button
            class="result_item__favorite"
            type="button"
            aria-label="お気に入りに追加"
            data-favorite-id="penlight-standard"
          >
            ♡
          </button>
        </article>
        <article class="result_item" data-result-item data-price="3200" data-order="2">
          <a class="result_item__link" href="product_detail.html">
            <img src="assets/images/penlight.png" alt="" />
            <div>
              <h2 data-product-name>ペンライト（2本セット）</h2>
              <p>
                <span data-product-price>¥3,200</span>
                〜/
                <span data-rental-days>3日</span>
              </p>
            </div>
          </a>
          <button
            class="result_item__favorite"
            type="button"
            aria-label="お気に入りに追加"
            data-favorite-id="penlight-pair"
          >
            ♡
          </button>
        </article>
        <article class="result_item" data-result-item data-price="2600" data-order="3">
          <a class="result_item__link" href="product_detail.html">
            <img src="assets/images/penlight.png" alt="" />
            <div>
              <h2 data-product-name>ペンライト（カラーチェンジ）</h2>
              <p>
                <span data-product-price>¥2,600</span>
                〜/
                <span data-rental-days>3日</span>
              </p>
            </div>
          </a>
          <button
            class="result_item__favorite"
            type="button"
            aria-label="お気に入りに追加"
            data-favorite-id="penlight-color-change"
          >
            ♡
          </button>
        </article>
        <article class="result_item" data-result-item data-price="1500" data-order="6">
          <a class="result_item__link" href="product_detail.html">
            <img src="assets/images/penlight.png" alt="" />
            <div>
              <h2 data-product-name>ペンライト（ライトタイプ）</h2>
              <p>
                <span data-product-price>¥1,500</span>
                〜/
                <span data-rental-days>3日</span>
              </p>
            </div>
          </a>
          <button
            class="result_item__favorite"
            type="button"
            aria-label="お気に入りに追加"
            data-favorite-id="penlight-light"
          >
            ♡
          </button>
        </article>
        <article class="result_item" data-result-item data-price="3600" data-order="5">
          <a class="result_item__link" href="product_detail.html">
            <img src="assets/images/penlight.png" alt="" />
            <div>
              <h2 data-product-name>ペンライト（ロングタイプ）</h2>
              <p>
                <span data-product-price>¥3,600</span>
                〜/
                <span data-rental-days>3日</span>
              </p>
            </div>
          </a>
          <button
            class="result_item__favorite"
            type="button"
            aria-label="お気に入りに追加"
            data-favorite-id="penlight-long"
          >
            ♡
          </button>
        </article>
      </section>

      <footer class="app_footer">
        <nav aria-label="フッターナビゲーション">
          <a href="about.html">お店について</a>
          <a href="usage_guide.html">使い方ガイド</a>
          <a href="#">利用規約</a>
          <a href="privacy_policy.html">個人情報保護方針</a>
        </nav>
        <small>Tokimekilab&copy;2026</small>
      </footer>
      <nav class="bottom_nav" aria-label="下部ナビゲーション">
        <a
          href="home.html"
          data-nav-icon
          data-pages="home.html,artist_search.html,goods_search.html,search.html,product_detail.html"
        >
          <img
            src="assets/images/home-icon--outline.png"
            data-outline="assets/images/home-icon--outline.png"
            data-filled="assets/images/home-icon--filled.png"
            alt=""
          />
          ホーム
        </a>
        <a href="favorites.html" data-favorite-nav>
          <span class="bottom_nav__favorite_icon" aria-hidden="true">♥</span>
          <span class="bottom_nav__badge" data-favorite-count>0</span>
          お気に入り
        </a>
        <a href="mypage.html" data-nav-icon data-pages="mypage.html">
          <img
            src="assets/images/mypage-icon--outline.png"
            data-outline="assets/images/mypage-icon--outline.png"
            data-filled="assets/images/mypage-icon--filled.png"
            alt=""
          />
          マイページ
        </a>
      </nav>
    </main>
  </body>
</html>
