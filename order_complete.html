<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>注文確定 | おしりーす</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/scss/style.css" />
    <script src="assets/js/app.js" defer></script>
  </head>
  <body class="mobile_app">
    <main class="app_shell order_page" data-order-complete>
      <header class="mypage_header">
        <a class="mypage_header__back" href="home.html" aria-label="トップへ戻る">
          <img src="assets/images/back.png" alt="" />
        </a>
        <p class="order_page__header_title">カート</p>
        <div class="mypage_header__actions">
          <a href="#" aria-label="通知">
            <img src="assets/images/notice-icon--outline.png" alt="" />
          </a>
          <a href="cart.html" aria-label="カート">
            <img src="assets/images/cart-icon--outline.png" alt="" />
          </a>
        </div>
      </header>
      <section class="order_complete">
        <h1>注文確定</h1>
        <p class="order_complete__thanks">ご注文ありがとうございました</p>
        <dl class="order_complete__summary">
          <div>
            <dt>ご注文受付日：</dt>
            <dd data-complete-date></dd>
          </div>
          <div>
            <dt>レンタル期間：</dt>
            <dd data-complete-period></dd>
          </div>
          <div>
            <dt>支払い方法：</dt>
            <dd data-complete-payment></dd>
          </div>
          <div>
            <dt>合計金額：</dt>
            <dd data-complete-total></dd>
          </div>
        </dl>
        <p class="order_complete__message">
          レンタルのお申し込みが確定しました。
          <br />
          ご登録のメールアドレスへ、ご注文内容とレンタルに関する確認メールをお送りしました。
          <br />
          メールが届かない場合は、迷惑メールフォルダをご確認いただくか、お問い合わせください。
        </p>
        <a class="order_page__primary" href="home.html">トップに戻る</a>
      </section>
      <footer class="app_footer">
        <nav aria-label="フッターナビゲーション">
          <a href="about.html">お店について</a>
          <a href="usage_guide.html">使い方ガイド</a>
          <a href="#">利用規約</a>
          <a href="privacy_policy.html">個人情報保護方針</a>
        </nav>
        <small>Tokimekilab&copy;2026</small>
      </footer>
      <nav class="bottom_nav" aria-label="下部ナビゲーション">
        <a
          href="home.html"
          data-nav-icon
          data-pages="home.html,artist_search.html,goods_search.html,search.html,product_detail.html"
        >
          <img
            src="assets/images/home-icon--outline.png"
            data-outline="assets/images/home-icon--outline.png"
            data-filled="assets/images/home-icon--filled.png"
            alt=""
          />
          ホーム
        </a>
        <a href="favorites.html" data-favorite-nav>
          <span class="bottom_nav__favorite_icon" aria-hidden="true">♥</span>
          <span class="bottom_nav__badge" data-favorite-count>0</span>
          お気に入り
        </a>
        <a
          href="mypage.html"
          data-nav-icon
          data-pages="mypage.html,rental_history.html,member_info.html,cancellation_refund.html,color_change.html,password_setting.html,credit_card.html"
        >
          <img
            src="assets/images/mypage-icon--outline.png"
            data-outline="assets/images/mypage-icon--outline.png"
            data-filled="assets/images/mypage-icon--filled.png"
            alt=""
          />
          マイページ
        </a>
      </nav>
    </main>
  </body>
</html>
