<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Top button -->
  <rect x="36" y="10" width="28" height="7" rx="3.5" fill="#7990be" />
  <rect x="45" y="17" width="10" height="7" fill="#7990be" />
  <!-- Side button (top right) -->
  <rect x="72" y="20" width="10" height="7" rx="2" transform="rotate(45 77 23.5)" fill="#7990be" />
