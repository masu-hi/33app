<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>推しカラー変更 | おしりーす</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/scss/style.css" />
    <script src="assets/js/user_storage.js"></script>
    <script src="assets/js/theme_init.js"></script>
    <script type="module" src="assets/js/profile_bootstrap.js"></script>
  </head>
  <body class="mobile_app is_product_data_loading" aria-busy="true">
    <div class="product_data_loading" data-product-data-loading role="status">
      <span class="product_data_loading__spinner" aria-hidden="true"></span>
      会員情報を読み込んでいます
    </div>
    <main class="app_shell">
      <header class="app_header">
        <a
          class="app_header__icon"
          href="color_change.html"
          aria-label="設定"
          data-nav-icon
          data-pages="color_change.html,password_setting.html,credit_card.html"
        >
          <img
            src="assets/images/setting-icon--outline.png"
            data-outline="assets/images/setting-icon--outline.png"
            data-filled="assets/images/setting-icon--filled.png"
            alt=""
          />
        </a>
        <img class="app_header__logo" src="assets/images/logo.png" alt="おしりーす" />
        <div class="app_header__actions">
          <a href="#" aria-label="通知" data-nav-icon data-pages="notice.html">
            <img
              src="assets/images/notice-icon--outline.png"
              data-outline="assets/images/notice-icon--outline.png"
              data-filled="assets/images/notice-icon--filled.png"
              alt=""
            />
          </a>
          <a href="cart.html" aria-label="カート" data-nav-icon data-pages="cart.html">
            <img
              src="assets/images/cart-icon--outline.png"
              data-outline="assets/images/cart-icon--outline.png"
              data-filled="assets/images/cart-icon--filled.png"
              alt=""
            />
          </a>
        </div>
      </header>
      <section class="color_change_page" aria-labelledby="color-change-title">
        <a class="color_change_page__account_title" href="member_info.html">会員情報</a>
        <a class="color_change_page__card_link" href="password_setting.html">パスワード設定</a>
        <a class="color_change_page__card_link" href="credit_card.html">
          クレジットカードの登録変更・追加
        </a>
        <h2 id="color-change-title" class="color_change_page__title">推しカラー変更</h2>
        <div class="color_change_page__choices" role="group" aria-label="推しカラーを選択">
          <button class="color_button color_button--red" type="button" data-favorite-color="赤">
            赤
          </button>
          <button class="color_button color_button--blue" type="button" data-favorite-color="青">
            青
          </button>
          <button
            class="color_button color_button--pink"
            type="button"
            data-favorite-color="ピンク"
          >
            ピンク
          </button>
          <button class="color_button color_button--aqua" type="button" data-favorite-color="水色">
            水色
          </button>
          <button
            class="color_button color_button--orange"
            type="button"
            data-favorite-color="オレンジ"
          >
            オレンジ
          </button>
          <button class="color_button color_button--purple" type="button" data-favorite-color="紫">
            紫
          </button>
          <button
            class="color_button color_button--yellow"
            type="button"
            data-favorite-color="黄色"
          >
            黄色
          </button>
          <button class="color_button color_button--green" type="button" data-favorite-color="緑">
            緑
          </button>
          <button class="color_button color_button--white" type="button" data-favorite-color="白">
            白
          </button>
          <button class="color_button color_button--black" type="button" data-favorite-color="黒">
            黒
          </button>
        </div>
        <p class="color_change_page__status" data-color-status role="status"></p>
      </section>
      <footer class="app_footer">
        <nav aria-label="フッターナビゲーション">
          <a href="about.html">お店について</a>
          <a href="usage_guide.html">使い方ガイド</a>
          <a href="#">利用規約</a>
          <a href="privacy_policy.html">個人情報保護方針</a>
        </nav>
        <small>Tokimekilab&copy;2026</small>
      </footer>
      <nav class="bottom_nav" aria-label="下部ナビゲーション">
        <a
          href="home.html"
          data-nav-icon
          data-pages="home.html,artist_search.html,goods_search.html,search.html,product_detail.html"
        >
          <img
            src="assets/images/home-icon--outline.png"
            data-outline="assets/images/home-icon--outline.png"
            data-filled="assets/images/home-icon--filled.png"
            alt=""
          />
          ホーム
        </a>
        <a href="favorites.html" data-favorite-nav>
          <span class="bottom_nav__favorite_icon" aria-hidden="true">♥</span>
          <span class="bottom_nav__badge" data-favorite-count>0</span>
          お気に入り
        </a>
        <a
          href="mypage.html"
          data-nav-icon
          data-pages="mypage.html,rental_history.html,member_info.html,color_change.html,password_setting.html,credit_card.html"
        >
          <img
            src="assets/images/mypage-icon--outline.png"
            data-outline="assets/images/mypage-icon--outline.png"
            data-filled="assets/images/mypage-icon--filled.png"
            alt=""
          />
          マイページ
        </a>
      </nav>
    </main>
  </body>
</html>
