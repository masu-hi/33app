<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カート | おしりーす</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/scss/style.css" />
    <script src="assets/js/app.js" defer></script>
  </head>
  <body class="mobile_app">
    <main class="app_shell cart_page" data-cart-page>
      <header class="mypage_header">
        <button type="button" aria-label="前の画面へ戻る" data-history-back>
          <img src="assets/images/back.png" alt="" />
        </button>
        <p class="cart_page__header_title">カート</p>
        <div class="mypage_header__actions">
          <a href="#" aria-label="通知">
            <img src="assets/images/notice-icon--outline.png" alt="" />
          </a>
          <a href="cart.html" aria-label="カート" aria-current="page">
            <img src="assets/images/cart-icon--filled.png" alt="" />
          </a>
        </div>
      </header>

      <section class="cart_page__content">
        <h1>
          カートに入っている商品：
          <span data-cart-item-count>0</span>
          点
        </h1>

        <div class="cart_page__empty" data-cart-empty hidden>
          <p>カートに商品はありません</p>
          <a href="home.html">商品を探す</a>
        </div>

        <article class="cart_product" data-cart-product>
          <img src="assets/images/penlight.png" alt="LEDコンサートライト" />
          <div class="cart_product__details">
            <h2>
              ペンライト
              <br />
              （シンプルタイプ）
            </h2>
            <p>¥800 / 3泊4日〜</p>
          </div>
          <div class="cart_product__controls">
            <button type="button" class="cart_product__remove" data-remove-cart>削除</button>
            <div class="cart_product__quantity" aria-label="数量">
              <button type="button" aria-label="数量を1減らす" data-cart-decrease>−</button>
              <span data-cart-quantity>1</span>
              <button type="button" aria-label="数量を1増やす" data-cart-increase>＋</button>
            </div>
          </div>
        </article>

        <div class="cart_page__total" data-cart-summary>
          <div>
            <span>合計</span>
            <small>※往復送料440円（税込）を含みます。</small>
          </div>
          <strong data-cart-total>¥0</strong>
        </div>

        <a class="cart_page__checkout" href="checkout.html" data-cart-checkout>
          決済方法を選択する
        </a>
      </section>

      <footer class="app_footer">
        <nav aria-label="フッターナビゲーション">
          <a href="#">お店について</a>
          <a href="#">使い方ガイド</a>
          <a href="#">利用規約</a>
          <a href="#">個人情報保護方針</a>
        </nav>
        <small>Tokimekilab&copy;2026</small>
      </footer>
    </main>
  </body>
</html>
