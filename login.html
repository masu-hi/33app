<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ログイン | おしりーす</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/scss/style.css" />
    <script src="assets/js/auth.js" defer></script>
  </head>
  <body class="app_auth">
    <main class="auth_screen auth_screen--login">
      <header class="auth_header"><img src="assets/images/logo.png" alt="おしりーす" /></header>
      <section class="login_form" aria-labelledby="login_title">
        <h1 id="login_title">ログイン</h1>
        <form action="home.html" data-login-form>
          <label>
            メールアドレス
            <input name="email" type="email" required autocomplete="email" />
          </label>
          <label>
            パスワード
            <input name="password" type="password" required autocomplete="current-password" />
          </label>
          <p class="password_help">
            パスワードを忘れた方は
            <a href="#">こちら</a>
          </p>
          <button class="auth_primary" type="submit">ログイン</button>
        </form>
        <a class="auth_secondary" href="register.html">新規会員登録</a>
      </section>
    </main>
  </body>
</html>
